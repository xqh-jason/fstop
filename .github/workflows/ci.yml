name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 不要在这里写 version：package.json 的 packageManager 已经是唯一来源，
      # 两边都写会直接报「Multiple versions of pnpm specified」（CI 曾因此长期红着）。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # §11.4 静态检查：src/ 中除白名单外不得出现任何网络构造
      - name: Zero-egress assertion (static)
        run: pnpm check:egress

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
